name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package
      - run: python3 scripts/check-vsix.py
      - uses: actions/upload-artifact@v4
        with:
          name: rv32-development-vsix
          path: dist/*.vsix
